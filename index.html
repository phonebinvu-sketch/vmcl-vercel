<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLP - Cloud Phone & Roblox Script Hub</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        heading: ['Space Grotesk', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        cyber: {
                            bg: '#05070c',
                            card: '#0d111a',
                            border: '#1b2234',
                            accent: '#00f2fe',
                            purple: '#7928ca'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #05070c;
            background-image: 
                radial-gradient(at 10% 10%, rgba(0, 242, 254, 0.08) 0px, transparent 40%),
                radial-gradient(at 90% 80%, rgba(121, 40, 202, 0.08) 0px, transparent 40%);
            background-attachment: fixed;
        }
        .glass-panel {
            background: rgba(13, 17, 26, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(27, 34, 52, 0.8);
        }
    </style>
</head>
<body class="text-gray-200 font-sans min-h-screen flex flex-col antialiased">

    <!-- Header Navigation -->
    <header class="sticky top-0 z-50 backdrop-blur-xl bg-[#05070c]/80 border-b border-cyber-border">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-cyan-400 to-purple-600 p-[1px]">
                    <div class="w-full h-full bg-cyber-bg rounded-[11px] flex items-center justify-center">
                        <span class="font-heading font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-purple-500 text-xl">C</span>
                    </div>
                </div>
                <div>
                    <span class="font-heading font-bold text-xl tracking-wider text-white block leading-none">CLP<span class="text-cyan-400">.</span></span>
                    <span class="text-[9px] text-gray-400 tracking-widest font-mono uppercase">Cloud Phone & Script Hub</span>
                </div>
            </div>

            <nav class="hidden md:flex items-center space-x-6 text-sm font-medium">
                <a href="#quick-tools" class="text-gray-300 hover:text-cyan-400 transition-colors">Lối Tắt Tool</a>
                <a href="#scripts" class="text-gray-300 hover:text-cyan-400 transition-colors">Roblox Scripts</a>
                <a href="#files" class="text-gray-300 hover:text-cyan-400 transition-colors">APK Executor</a>
            </nav>

            <div class="flex items-center space-x-3">
                <span class="text-[11px] font-mono bg-cyan-950/60 text-cyan-400 border border-cyan-500/30 px-3 py-1 rounded-full flex items-center gap-1.5">
                    <span class="w-1.5 h-1.5 rounded-full bg-cyan-400 animate-ping"></span>
                    VERCEL READY
                </span>
            </div>
        </div>
    </header>

    <!-- Hero Banner Section -->
    <section class="py-12 px-4 relative overflow-hidden">
        <div class="max-w-4xl mx-auto text-center space-y-4">
